server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sharding-local}
  application:
    name: kpdp-dianping-core
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:kpdp}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.kpdp.entity

logging:
  level:
    com.kpdp: debug
  pattern:
    dateformat: mm:ss.SSS

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      expiry:
        "[http.server.requests]": 10s
      buffer-length:
        "[http.server.requests]": 1
  simple:
    metrics:
      export:
        step: 10s

kpdp:
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:-1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  rocketmq:
    voucher-cache-invalidate-topic: ${VOUCHER_CACHE_INVALIDATE_TOPIC:voucher-cache-invalidate-topic}
    voucher-cache-invalidate-consumer-group: ${VOUCHER_CACHE_INVALIDATE_CONSUMER_GROUP:kpdp-voucher-cache-invalidate-consumer-${server.port}}
  cache:
    local:
      voucher:
        enabled: ${LOCAL_VOUCHER_CACHE_ENABLED:true}
        max-size: ${LOCAL_VOUCHER_CACHE_MAX_SIZE:10000}
        ttl-minutes: ${LOCAL_VOUCHER_CACHE_TTL_MINUTES:5}
  bloom:
    voucher:
      enabled: ${LOCAL_VOUCHER_BLOOM_ENABLED:true}
      expected-insertions: ${VOUCHER_BLOOM_EXPECTED_INSERTIONS:10000}
      false-positive-rate: ${VOUCHER_BLOOM_FALSE_POSITIVE_RATE:0.01}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    scan-delay-ms: ${OUTBOX_SCAN_DELAY_MS:100}
    compensation-initial-delay-ms: ${OUTBOX_COMPENSATION_INITIAL_DELAY_MS:60000}
    compensation-scan-delay-ms: ${OUTBOX_COMPENSATION_SCAN_DELAY_MS:300000}
    retry-interval-seconds: ${OUTBOX_RETRY_INTERVAL_SECONDS:5}
    sending-timeout-seconds: ${OUTBOX_SENDING_TIMEOUT_SECONDS:30}
    max-retry-count: ${OUTBOX_MAX_RETRY_COUNT:3}
  order-timeout:
    initial-delay-ms: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:600000}
    scan-delay-ms: ${ORDER_TIMEOUT_SCAN_DELAY_MS:600000}
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:30}
    batch-size: ${ORDER_TIMEOUT_BATCH_SIZE:50}
  stock-check:
    initial-delay-ms: ${STOCK_CHECK_INITIAL_DELAY_MS:600000}
    scan-delay-ms: ${STOCK_CHECK_SCAN_DELAY_MS:600000}
  rate-degrade:
    initial-delay-ms: ${RATE_DEGRADE_INITIAL_DELAY_MS:5000}
    scan-delay-ms: ${RATE_DEGRADE_SCAN_DELAY_MS:5000}
    p95-threshold-ms: ${RATE_DEGRADE_P95_THRESHOLD_MS:100}
    recover-threshold-ms: ${RATE_DEGRADE_RECOVER_THRESHOLD_MS:70}
    degrade-consecutive-threshold: ${RATE_DEGRADE_DEGRADE_CONSECUTIVE_THRESHOLD:3}
    recover-consecutive-threshold: ${RATE_DEGRADE_RECOVER_CONSECUTIVE_THRESHOLD:6}
    default-global-limit: ${RATE_DEGRADE_DEFAULT_GLOBAL_LIMIT:200}
    degraded-global-limit: ${RATE_DEGRADE_DEGRADED_GLOBAL_LIMIT:100}
    global-window-seconds: ${RATE_DEGRADE_GLOBAL_WINDOW_SECONDS:1}
